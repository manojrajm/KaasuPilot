name: Update APK Download Count

on:
  schedule:
    # Refresh every 1 hour
    - cron: "0 * * * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-download-count
  cancel-in-progress: true

jobs:
  update-download-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch APK download counts and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          async function main() {
            const fullRepo = process.env.GITHUB_REPOSITORY || "manojrajm/KaasuPilot";
            const [owner, repo] = fullRepo.split("/");

            let url = `https://api.github.com/repos/${owner}/${repo}/releases?per_page=100`;
            let totalDownloads = 0;

            while (url) {
              const response = await fetch(url, {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28"
                }
              });

              if (!response.ok) {
                throw new Error(`GitHub API error: ${response.status} ${await response.text()}`);
              }

              const releases = await response.json();

              for (const release of releases) {
                if (release.draft) continue;

                for (const asset of release.assets || []) {
                  if (asset.name && asset.name.toLowerCase().endsWith(".apk")) {
                    totalDownloads += asset.download_count || 0;
                  }
                }
              }

              const link = response.headers.get("link");
              const next = link?.match(/<([^>]+)>;\s*rel="next"/);
              url = next ? next[1] : null;
            }

            const readmePath = "README.md";
            let readme = fs.readFileSync(readmePath, "utf8");

            const updatedSection = [
              "<!-- APK-DOWNLOAD-COUNT:START -->",
              `**Total APK downloads: ${totalDownloads.toLocaleString("en-IN")}**`,
              "<!-- APK-DOWNLOAD-COUNT:END -->"
            ].join("\n");

            const markerPattern =
              /<!-- APK-DOWNLOAD-COUNT:START -->[\s\S]*?<!-- APK-DOWNLOAD-COUNT:END -->/;

            if (!markerPattern.test(readme)) {
              throw new Error("Download count markers were not found in README.md");
            }

            readme = readme.replace(markerPattern, updatedSection);
            fs.writeFileSync(readmePath, readme);

            console.log(`Updated total APK downloads: ${totalDownloads}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "Download count has not changed."
          else
            git add README.md
            git commit -m "chore: update APK download statistics"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
